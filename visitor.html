<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NLF Visitor Page</title>
        
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
      
      </head>
<body class="bg-green-900 py-10">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-lg">
    <div class="flex justify-center mb-4">
      <img class="h-16" src="images/logo.png" alt="New Life Fellowship Logo">
    </div>
    <h1 class="text-3xl font-bold mb-6 text-center text-[#0c1a3c]">Visitor Information Form</h1>
    
    <div id="form-wrapper">
    <form
        action="https://script.google.com/macros/s/AKfycbyqMikA27xFafHgze70Pd_I9-VtXE9v0zq7XHRS9PibLdb3i55iv9A7kS6IJDgEOUWMPQ/exec"
        method="POST"
        target="hidden_iframe"
        onsubmit="submitted=true;"
        class="space-y-5"
    >
      <div>
        <label class="block mb-1 font-semibold text-gray-800">Full Name</label>
        <input type="text" name="name" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#0c1a3c]" required>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-800">Birth Date</label>
        <input type="date" name="birthdate" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#0c1a3c]" required>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-800">Phone Number</label>
        <input type="tel" name="phone" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#0c1a3c]" required>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-800">Email</label>
        <input type="email" name="email" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#0c1a3c]" required>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-800">Is this your first time?</label>
        <div class="space-y-1 pl-2 text-gray-700">
          <label><input type="radio" name="visit_time" value="first_time" class="mr-2">First Time</label><br>
          <label><input type="radio" name="visit_time" value="been_before" class="mr-2">Been Before</label>
        </div>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-800">Are you looking for a church home or just visiting?</label>
        <div class="space-y-1 pl-2 text-gray-700">
          <label><input type="radio" name="purpose" value="church_home" class="mr-2">Looking for a Church Home</label><br>
          <label><input type="radio" name="purpose" value="just_visiting" class="mr-2">Just Visiting</label>
        </div>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-800">Would you like to receive updates?</label>
        <div class="space-y-1 pl-2 text-gray-700">
          <label><input type="radio" name="updates" value="yes" class="mr-2">Yes</label><br>
          <label><input type="radio" name="updates" value="no" class="mr-2">No</label>
        </div>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-800">How did you hear about our church?</label>
        <textarea name="referral" rows="3" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#0c1a3c]" placeholder="Friend, Social Media, Flyer, etc..."></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="bg-[#0c1a3c] text-white font-semibold px-6 py-2 rounded hover:bg-[#e4b13f] transition duration-300">Submit</button>
      </div>
      <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

        <!-- Confirmation Alert -->
        <!-- <script>
        document.querySelector("form").addEventListener("submit", function () {
            alert("Submitting form..."); 
        });
        </script> -->
      

    </form>
    </div>
    <div id="thank-you" class="hidden text-center p-6 bg-white rounded-lg shadow-lg animate-fade-in">
  <h2 class="text-2xl font-bold text-[#0c1a3c] mb-2">Thank you for visiting!</h2>
  <p class="text-gray-700 mb-4">We're so glad you joined us today. If you requested updates, you’ll hear from us soon.</p>
  <p class="italic text-sm text-gray-500">“For where two or three gather in my name, there am I with them.” – Matthew 18:20</p>
</div>
  </div>
    <script>
        function handleFormSubmit() {
            setTimeout(() => {
            // Hide the form
            document.getElementById("form-wrapper").classList.add("hidden");
            // Show the thank-you message
            document.getElementById("thank-you").classList.remove("hidden");
            }, 1000); // Delay so the form finishes submitting to the iframe
        }
    </script>

        <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fade-in 0.6s ease-out forwards;
        }
        </style>
</body>
</html>
